services:
  scheduler:
    build:
      context: ../..
      dockerfile: code/pipeline.Dockerfile
    volumes:
      - ../../data:/project/data
      - ../../models:/project/models
      - ../../mlruns:/project/mlruns
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pmldl-deployment:latest
    command: ["uvicorn", "api_main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - ../../models:/models:ro
    environment:
      - MODEL_PATH=/models/model.pkl
    restart: unless-stopped

  app:
    image: pmldl-deployment:latest
    command: ["streamlit", "run", "app_main.py", "--server.port=8501", "--server.address=0.0.0.0", "--client.toolbarMode=minimal"]
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
